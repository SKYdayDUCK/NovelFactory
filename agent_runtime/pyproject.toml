[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "nf-agent-runtime"
version = "0.1.0"
description = "Stateless model transports and route selection for authorized callers"
requires-python = ">=3.12"
dependencies = ["PyJWT[crypto]>=2.10,<3", "pywin32>=312; sys_platform == 'win32'"]


[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "providers.py", "plan_auth.py", "_http_worker.py", "_windows_host.py", "codex.py", "host_process.py", "routing.py", "protocol.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "agent_runtime"
