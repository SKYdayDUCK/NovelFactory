name: Archive measured HTTP query comparison
on:
  push:
    branches: ['evidence/p55-http-query-comparison']
    paths: ['.github/workflows/p55-http-receipt.yml','evidence/p55/checkpoints/archive_http_probe.py']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: instructions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: evidence/p55-http-query-comparison
          path: receipt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43041082878
          name: same-runner-600s-55d897-and-df30c30
          path: download
      - run: python instructions/evidence/p55/checkpoints/archive_http_probe.py
      - name: Commit the checked synthetic measurements on the evidence branch
        working-directory: receipt
        run: |
          git config user.name "NovelFactory evidence collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/p55/http-validation
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p55): retain both original 600s HTTP probe outcomes"
            git push origin HEAD:refs/heads/evidence/p55-http-query-comparison
          fi
