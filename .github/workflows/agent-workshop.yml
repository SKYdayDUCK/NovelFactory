name: Agent Workshop PostgreSQL and stdio
on:
  pull_request:
    paths:
      - 'workshop/**'
      - '.github/workflows/agent-workshop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:8
        ports: ['6379:6379']
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: workshop_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: workshop
    env:
      AW_REDIS_TEST_URL: redis://127.0.0.1:6379/0
      AW_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/workshop_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked --extra streams
      - name: Exercise installed wheel and packaged migrations
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/aw-wheel"
          uv pip install --python "$RUNNER_TEMP/aw-wheel/bin/python" --no-deps dist/*.whl
          # Use the isolated locked dependencies; prefer wheel modules to the checkout.
          installed=$("$RUNNER_TEMP/aw-wheel/bin/python" -c 'import site;print(site.getsitepackages()[0])')
          PYTHONPATH="$installed" .venv/bin/python -m agent_workshop.migrate upgrade
          PYTHONPATH="$installed" .venv/bin/python -m agent_workshop.migrate current
      - run: uv run --locked --extra streams pytest -q --junitxml=workshop-results.xml
      - uses: actions/checkout@v4
        with:
          ref: 348b389d025b9576e8185eebe53917d04d8681e1
          path: nf-peer
          persist-credentials: false
      - name: Install pinned NF host and role isolation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux gcc libc6-dev
          prefix="$RUNNER_TEMP/aw-codex"
          npm install --prefix "$prefix" --no-save --no-audit --no-fund @openai/codex@0.167.0-alpha.4
          native="$prefix/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin"
          test "$("$native/codex" --version)" = "codex-cli 0.167.0-alpha.4"
          echo "$native" >> "$GITHUB_PATH"
      - name: Test the pinned NF peer over independent PostgreSQL accounts and stdio
        run: |
          export AW_NF_SOURCE="$GITHUB_WORKSPACE/nf-peer"
          export AW_DUAL_TEST_ADMIN_URL="$AW_DATABASE_URL"
          export PYTHONPATH="$PWD/src:$AW_NF_SOURCE/src"
          uv sync --project "$AW_NF_SOURCE" --locked
          export AW_ACCEPTANCE_OUTPUT="$PWD/ci-evidence"
          export AW_BENCH_RESULTS="$AW_ACCEPTANCE_OUTPUT"
          "$AW_NF_SOURCE/.venv/bin/python" -m pytest -q integration/test_dual_stdio.py integration/test_manager_resume.py --junitxml=dual-results.xml
          "$AW_NF_SOURCE/.venv/bin/python" -m pytest -q benchmarks/cross_service_scene.py --junitxml=scene-results.xml
          "$AW_NF_SOURCE/.venv/bin/python" -m pytest -q benchmarks/delegation_capacity.py --junitxml=capacity-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-results
          path: |
            workshop/workshop-results.xml
            workshop/dual-results.xml
            workshop/scene-results.xml
            workshop/capacity-results.xml
            workshop/ci-evidence
