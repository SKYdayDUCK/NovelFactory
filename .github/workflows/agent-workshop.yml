name: Agent Workshop PostgreSQL and stdio
on:
  pull_request:
    paths:
      - 'workshop/**'
      - '.github/workflows/agent-workshop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:8
        ports: ['6379:6379']
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: workshop_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: workshop
    env:
      AW_REDIS_TEST_URL: redis://127.0.0.1:6379/0
      AW_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/workshop_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked --extra streams
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked --extra streams pytest -q --junitxml=workshop-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-results
          path: workshop/workshop-results.xml
