name: Verify formal P5.7 merge topology
on:
  push:
    branches: [dev/p57-creative-harness-s1-s6]
    paths:
      - '.github/workflows/p57-merge-topology.yml'
      - 'reports/harness/evidence/s6/remote-qualification-target.txt'
permissions:
  contents: read
jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independently replay the non-fast-forward merge from its two actual parents
        shell: bash
        run: |
          set -euo pipefail
          target=$(cat reports/harness/evidence/s6/remote-qualification-target.txt)
          [[ "$target" =~ ^[a-f0-9]{40}$ ]]
          if ! git cat-file -e "$target^{commit}" 2>/dev/null; then git fetch --no-tags origin "$target"; fi
          read -ra parents <<< "$(git show -s --format=%P "$target")"
          test "${#parents[@]}" -eq 2
          old=${parents[0]}
          code=${parents[1]}
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$old"
          test "$(git merge-base "$old" "$code")" = "$old"
          place="$RUNNER_TEMP/formal-replay"
          git worktree add --detach "$place" "$old"
          git -C "$place" -c user.name="Engineering qualification" -c user.email="ci@localhost" merge --no-ff --no-commit "$code"
          tree=$(git -C "$place" write-tree)
          test "$tree" = "$(git rev-parse "$target^{tree}")"
          test "$tree" = "$(git rev-parse "$code^{tree}")"
          test -z "$(git ls-tree -r --name-only "$target" reports/code_review/p57_creative_harness)"
          test -z "$(git ls-tree -r --name-only "$target" reports/harness/evidence/s6/recovery .github/workflows/p57-target-engineering.yml .github/workflows/p57-supplementary-engineering.yml .github/workflows/p57-restore-frozen.yml)"
          git diff --check "$old" "$target"
          git diff --stat "$old" "$target"
          git diff --name-status "$old" "$target" > "$RUNNER_TEMP/p57-range.txt"
          sha256sum "$RUNNER_TEMP/p57-range.txt"
          git diff --binary "$old" "$target" | sha256sum
          printf 'P57_MERGE_MATCH %s %s %s %s\n' "$target" "$tree" "$old" "$code"
          git -C "$place" merge --abort
      - uses: actions/upload-artifact@v4
        with:
          name: p57-verified-merge-range
          path: ${{ runner.temp }}/p57-range.txt
          if-no-files-found: error
