name: P5.7 isolated 50-agent HTTP recheck

on:
  workflow_dispatch:
  push:
    branches: [main, 'dev/p57-creative-harness-s1-s6']
    paths:
      - '.github/workflows/p57-supplementary-http.yml'
      - 'reports/harness/evidence/s6/remote-qualification-target.txt'

permissions:
  contents: read

jobs:
  http-50:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      nf-db:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: nf-ci-admin
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.0.2
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      NF_TEST_DATABASE_URL: postgresql+psycopg://postgres:nf-ci-admin@127.0.0.1:5433/postgres
      NF_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact source revision
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target=$(python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('reports/harness/evidence/s6/remote-qualification-target.txt')
          if path.is_file():
              value = path.read_bytes()
              if re.fullmatch(rb'[0-9a-fA-F]{40}\r?\n?', value) is None:
                  raise SystemExit("The qualification target must contain one full Git commit SHA")
              target = value.decode('ascii').strip().lower()
          else:
              target = os.environ['GITHUB_SHA']
          if re.fullmatch(r'[0-9a-f]{40}', target) is None:
              raise SystemExit("Invalid qualification commit")
          print(target)
          PY
          )
          test "$(git cat-file -t "$target")" = commit
          git checkout --quiet --detach "$target"
          test "$(git rev-parse HEAD)" = "$target"
          printf 'sha=%s\n' "$target" >> "$GITHUB_OUTPUT"
          git diff --quiet 976e3212fcb42b9251fc2858a3b9d9ce3c3a646c "$target" -- \
            tests/service/test_http_load.py tests/service/conftest.py benchmarks/http_load.py \
            src/novel_factory/interfaces/http.py src/novel_factory/interfaces/admission.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Install the project's locked test environment
        run: uv sync --locked --python 3.12

      - name: Verify the real database and Redis versions
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg, redis
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ['NF_TEST_DATABASE_URL']).set(drivername='postgresql')
          with psycopg.connect(dsn.render_as_string(hide_password=False)) as conn:
              version = int(conn.execute("SHOW server_version_num").fetchone()[0])
          cache = redis.Redis.from_url(os.environ['NF_TEST_REDIS_URL'])
          redis_version = cache.info('server')['redis_version']
          assert cache.ping() and version == 170011 and redis_version == '8.0.2'
          services = {'postgres_server_version_num': version, 'redis_version': redis_version}
          (Path(os.environ['RUNNER_TEMP'])/'p57-http-services.json').write_text(json.dumps(services))
          PY

      - name: Run the original closed-loop case once
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export NF_LOAD_EVIDENCE_DIR="$RUNNER_TEMP/p57-http-raw"
          mkdir -p "$NF_LOAD_EVIDENCE_DIR"
          uv run --no-sync python -m pytest -q --tb=no \
            'tests/service/test_http_load.py::test_real_http_logical_agents_fixed_cut_and_bounded_connections[50]' \
            > "$RUNNER_TEMP/p57-http-pytest.log" 2>&1

      - name: Retain measured successes, faults, timing and connection counts
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          raw = tmp/'p57-http-raw/http_agents_50.json'
          services = tmp/'p57-http-services.json'
          report = {
              'source_sha': os.environ['TARGET_SHA'] or None,
              'trigger_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'services': json.loads(services.read_text()) if services.is_file() else None,
              'original_test': 'test_real_http_logical_agents_fixed_cut_and_bounded_connections[50]',
              'original_local_suite': {'passed': 58, 'failed': 1, 'successful_requests': 293,
                                       'required_requests': 300, 'unsuccessful_requests': 7,
                                       'retained_failure_sample': 'HTTP_429_BACKPRESSURE'},
              'required_successes': 300, 'configured_repetitions': 1,
              'pytest_step': os.environ['PROBE_OUTCOME'] or 'not_run',
              'scope': 'Small fixed-cut STATE query fixture, one loopback HTTP process, 50 logical agents and six closed-loop rounds. No AT-30 or literary capacity claim.',
              'observed': None, 'gate': 'NO_COMPLETED_MEASUREMENT',
          }
          if raw.is_file():
              data = json.loads(raw.read_text())
              counters = ('logical_agents', 'rounds', 'planned_requests', 'emitted_requests',
                          'completed_requests', 'not_emitted', 'successful_requests', 'new_world_revisions',
                          'external_model_calls', 'api_processes')
              obs = {k: int(data[k]) for k in counters}
              obs['unsuccessful_requests'] = obs['completed_requests'] - obs['successful_requests']
              obs['duration_seconds'] = float(data['duration_seconds'])
              obs['status_counts'] = {
                  k: int(v) for k, v in data['status_counts'].items()
                  if k in {'client_or_correctness_error'} or (len(k) == 3 and k.isdecimal())
              }
              obs['backpressure_429'] = sum(
                  f.get('http_status') == 429 and f.get('code') == 'BACKPRESSURE' for f in data['failures']
              )
              obs['latency_all_responses'] = {k: v for k,v in data['latency_all_responses'].items()
                                               if type(v) in (int,float)}
              obs['database'] = {
                  k: int(data['database'][k]) for k in
                  ('peak_checked_out_connections', 'checked_out_at_end', 'configured_pool_size', 'failed_statements')
              }
              obs['client_barrier_peak_checked_out'] = max(data['idle_wait_checked_out_samples'],default=None)
              report['observed'] = obs
              report['gate'] = 'MET' if (
                  report['pytest_step'] == 'success' and obs['successful_requests'] == 300
                  and obs['planned_requests'] == obs['completed_requests'] == 300
                  and obs['database']['configured_pool_size'] == 8
              ) else 'NOT_MET'
          delivery = tmp/'p57-http-public'
          delivery.mkdir(exist_ok=True)
          (delivery/'supplementary-http.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Upload the sanitized measurement even when the case fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p57-http-50-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p57-http-public/supplementary-http.json
          if-no-files-found: error

      - name: Apply the unchanged original test gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'p57-http-public/supplementary-http.json').read_text())
          raise SystemExit(0 if report['gate'] == 'MET' else 1)
          PY
