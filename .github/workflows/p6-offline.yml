name: P6 offline experiment and authorization checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/engineering_release_ci.py'
      - 'tests/unit/test_engineering_release_ci.py'
      - 'scripts/P6_*'
      - 'scripts/p6_budget.py'
      - 'scripts/p6_export_release.py'
      - 'tests/integration/test_p6_export_release.py'
      - 'src/novel_factory/application/budget_limits.py'
      - 'scripts/pitr_drill.py'
      - 'scripts/ci_install_pg17.sh'
      - 'reports/handoff/P6*'
      - '.github/workflows/p6-offline.yml'
      - 'reports/handoff/ENGINEERING_RELEASE.json'
  pull_request:
    paths:
      - 'scripts/engineering_release_ci.py'
      - 'tests/unit/test_engineering_release_ci.py'
      - 'scripts/P6_*'
      - 'scripts/p6_budget.py'
      - 'scripts/p6_export_release.py'
      - 'tests/integration/test_p6_export_release.py'
      - 'src/novel_factory/application/budget_limits.py'
      - 'scripts/pitr_drill.py'
      - 'scripts/ci_install_pg17.sh'
      - 'reports/handoff/P6*'
      - '.github/workflows/p6-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Verify the integrated source at the workflow checkout
        run: |
          python scripts/engineering_release_ci.py scripts/p6_budget.py
          mkdir -p "$RUNNER_TEMP/p6-offline"
          git rev-parse HEAD > "$RUNNER_TEMP/p6-offline/checkout.txt"
      - name: Verify offline preflight and engineering release checks
        shell: bash
        run: |
          uv sync --locked --group dev
          .venv/bin/python -m pytest -q tests/unit/test_engineering_release_ci.py --junitxml="$RUNNER_TEMP/p6-offline/release-checks.xml"
          .venv/bin/python scripts/P6_preflight_smoke.py --nf-checkout "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/p6-offline/preflight.log"
      - name: Verify the unconfigured author templates without credentials
        shell: bash
        run: |
          status=0
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" .venv/bin/python scripts/P6_preflight.py \
            --nf-checkout "$GITHUB_WORKSPACE" \
            --experiment reports/handoff/P6_experiment.example.json \
            --scene-file reports/handoff/P6_scene.example.json \
            --output "$RUNNER_TEMP/p6-offline/preflight-unconfigured.json" || status=$?
          test "$status" -eq 2
          python - "$RUNNER_TEMP/p6-offline/preflight-unconfigured.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["nf_source_sha"] == os.environ["GITHUB_SHA"]
          assert receipt["local_input_checks"] == "BLOCKED_ENVIRONMENT" and receipt["missing_or_inconsistent"]
          assert receipt["scenes_dispatched"] == receipt["db_connections_opened"] == 0
          assert receipt["production_model_requests_sent"] == receipt["http_provider_requests_sent"] == 0
          assert receipt["actual_cost"] is None and receipt["literary_acceptance"] == "NOT_EVALUATED"
          PY
      - name: Install physical PostgreSQL 17 restore tools
        run: |
          bash scripts/ci_install_pg17.sh postgresql-17 postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_verifybackup --version
      - uses: actions/checkout@v4
        with:
          repository: redis/redis
          ref: 994bc96bb1744cb153392fc96bdba43eae56e17f
          path: .ci-redis8
          persist-credentials: false
      - name: Build the pinned Redis 8 server with TLS and jemalloc
        run: |
          test "$(git -C .ci-redis8 rev-parse HEAD)" = 994bc96bb1744cb153392fc96bdba43eae56e17f
          if ! command -v g++ >/dev/null || ! pkg-config --exists openssl; then
            sudo apt-get -o Acquire::Retries=3 install -y build-essential pkg-config libssl-dev
          fi
          make -C .ci-redis8/src -j2 BUILD_TLS=yes MALLOC=jemalloc redis-server redis-cli redis-check-aof redis-check-rdb
          export PATH="$PWD/.ci-redis8/src:$PATH"
          redis-server --version | grep 'v=8.0.2 .*malloc=jemalloc-'
          redis-cli --help | grep -F -- --tls
          echo "$PWD/.ci-redis8/src" >> "$GITHUB_PATH"
      - name: Restore the shared token budget and its original UNKNOWN attempt
        run: |
          .venv/bin/python scripts/pitr_drill.py --output "$RUNNER_TEMP/p6-budget-drill" --with-redis --shared-token-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-shared-token-recovery
          path: ${{ runner.temp }}/p6-budget-drill/result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-offline-checks
          path: ${{ runner.temp }}/p6-offline
          if-no-files-found: error
