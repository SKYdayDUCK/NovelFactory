name: P6 offline experiment and authorization checks
on:
  pull_request:
    paths:
      - 'scripts/P6_*'
      - 'reports/handoff/P6*'
      - '.github/workflows/p6-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 013ebcadf4f7d3a64838096361c6432e4e679b8d
          path: nf-peer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Install locked NF and verify preflight with synthetic local input
        run: |
          uv sync --project nf-peer --locked
          nf-peer/.venv/bin/python scripts/P6_preflight_smoke.py --nf-checkout "$PWD/nf-peer"
      - name: Install physical PostgreSQL 17 restore tools
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/17/bin/pg_verifybackup || ! test -x /usr/lib/postgresql/17/bin/postgres; then
            if test -f /etc/apt/apt-mirrors.txt; then
              printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y postgresql-17 postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_verifybackup --version
      - name: Restore the shared token budget and its original UNKNOWN attempt
        working-directory: nf-peer
        run: |
          git apply --check ../evidence/p6/shared-token-pitr/drill.patch
          git apply ../evidence/p6/shared-token-pitr/drill.patch
          .venv/bin/python scripts/pitr_drill.py --output "$RUNNER_TEMP/p6-budget-drill"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-shared-token-recovery
          path: ${{ runner.temp }}/p6-budget-drill/result.json
          if-no-files-found: error
