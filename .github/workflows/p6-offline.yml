name: P6 offline experiment and authorization checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/P6_*'
      - 'scripts/p6_budget.py'
      - 'src/novel_factory/application/budget_limits.py'
      - 'reports/handoff/ENGINEERING_RELEASE.json'
      - '.github/workflows/p6-offline.yml'
  pull_request:
    paths:
      - 'scripts/P6_*'
      - 'reports/handoff/P6*'
      - '.github/workflows/p6-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 43dc369ab73e2faacb509b6ca16995848fc92c28
          path: nf-peer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Select the integrated NF source or the pinned peer
        run: |
          source_dir="$GITHUB_WORKSPACE/nf-peer"
          if test -f "$GITHUB_WORKSPACE/scripts/p6_budget.py"; then
            source_dir="$GITHUB_WORKSPACE"
          fi
          git -C "$source_dir" rev-parse HEAD
          echo "NF_SOURCE=$source_dir" >> "$GITHUB_ENV"
      - name: Install locked NF and verify preflight with synthetic local input
        run: |
          uv sync --project "$NF_SOURCE" --locked
          "$NF_SOURCE/.venv/bin/python" scripts/P6_preflight_smoke.py --nf-checkout "$NF_SOURCE"
      - name: Install physical PostgreSQL 17 restore tools
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/17/bin/pg_verifybackup || ! test -x /usr/lib/postgresql/17/bin/postgres; then
            if test -f /etc/apt/apt-mirrors.txt; then
              printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y postgresql-17 postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_verifybackup --version
      - uses: actions/checkout@v4
        with:
          repository: redis/redis
          ref: 994bc96bb1744cb153392fc96bdba43eae56e17f
          path: .ci-redis8
          persist-credentials: false
      - name: Build the pinned Redis 8 server with TLS and jemalloc
        run: |
          test "$(git -C .ci-redis8 rev-parse HEAD)" = 994bc96bb1744cb153392fc96bdba43eae56e17f
          if ! command -v g++ >/dev/null || ! pkg-config --exists openssl; then
            sudo apt-get -o Acquire::Retries=3 install -y build-essential pkg-config libssl-dev
          fi
          make -C .ci-redis8/src -j2 BUILD_TLS=yes MALLOC=jemalloc redis-server redis-cli redis-check-aof redis-check-rdb
          export PATH="$PWD/.ci-redis8/src:$PATH"
          redis-server --version | grep 'v=8.0.2 .*malloc=jemalloc-'
          redis-cli --help | grep -F -- --tls
          echo "$PWD/.ci-redis8/src" >> "$GITHUB_PATH"
      - name: Restore the shared token budget and its original UNKNOWN attempt
        run: |
          cd "$NF_SOURCE"
          git apply --check "$GITHUB_WORKSPACE/evidence/p6/shared-token-pitr/drill.patch"
          git apply "$GITHUB_WORKSPACE/evidence/p6/shared-token-pitr/drill.patch"
          .venv/bin/python scripts/pitr_drill.py --output "$RUNNER_TEMP/p6-budget-drill" --with-redis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-shared-token-recovery
          path: ${{ runner.temp }}/p6-budget-drill/result.json
          if-no-files-found: error
