name: P1 and P2 production integrity

on:
  push:
    branches: [main, "dev/p2-*", "dev/p3-p4-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: p1-integrity-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract-unit:
    name: Schema, domain, HTTP and production boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.12
      - name: Schema and original design validation
        run: |
          mkdir -p ci-evidence
          uv run --no-sync python validation/validate_package.py 2>&1 | tee ci-evidence/schema-validation.log
      - name: Original standalone mechanisms
        run: uv run --no-sync python -m unittest discover -s experiments -p 'test_*.py' -v 2>&1 | tee ci-evidence/original-mechanisms.log
      - name: Python unit, contract and ASGI slow-body regression tests
        run: |
          uv run --no-sync python -m pytest tests/unit tests/contracts tests/evaluation tests/service/test_admission.py -q \
            --junitxml=ci-evidence/unit.xml --json-report --json-report-file=ci-evidence/unit.json \
            2>&1 | tee ci-evidence/unit.log
      - name: Deterministic Chinese memory retrieval evaluation
        run: |
          uv run --no-sync python benchmarks/memory/evaluate.py \
            --output ci-evidence/memory \
            2>&1 | tee ci-evidence/memory.log
      - name: Same-source Chinese context and review ablations
        run: |
          uv run --no-sync python -m benchmarks.memory.controlled_evaluate \
            --output ci-evidence/memory-controlled \
            2>&1 | tee ci-evidence/memory-controlled.log
      - name: Upload immutable unit and schema run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-schema-unit-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 90

  postgres-integration:
    name: PostgreSQL 17 integration, concurrency and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: nf_test
          POSTGRES_USER: nf_dev
          POSTGRES_PASSWORD: nf_dev_ci_only
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf_dev -d nf_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      NF_DATABASE_URL: postgresql+psycopg://nf_dev:nf_dev_ci_only@127.0.0.1:5432/nf_test
      NF_TEST_DATABASE_URL: postgresql+psycopg://nf_dev:nf_dev_ci_only@127.0.0.1:5432/nf_test
      NF_EVIDENCE_DIR: ci-evidence/recovery
      NF_P2_ACCEPTANCE_EVIDENCE_DIR: ci-evidence/acceptance
      PG_BIN: /usr/lib/postgresql/17/bin
      NF_POOL_SIZE: '8'
      NF_POOL_OVERFLOW: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Paired compiler benchmark verifies the exact baseline Git blob.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install PostgreSQL 17 client for real pg_dump and pg_restore
        run: |
          if [[ ! -x "$PG_BIN/pg_dump" || ! -x "$PG_BIN/pg_restore" || ! -x "$PG_BIN/psql" ]]; then
            key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            if ! apt-cache show postgresql-client-17 >/dev/null 2>&1; then
              if [[ ! -s "$key" ]]; then
                curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
                  --connect-timeout 10 --max-time 60 --retry-max-time 180 \
                  --output "$RUNNER_TEMP/nf-pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
                sudo install -D -m 0644 "$RUNNER_TEMP/nf-pgdg.asc" "$key"
              fi
              echo "deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            fi
            sudo apt-get -o Acquire::Retries=4 update -qq
            sudo apt-get -o Acquire::Retries=4 install -y postgresql-client-17
          fi
          for tool in pg_dump pg_restore psql; do
            "$PG_BIN/$tool" --version | grep -E '\(PostgreSQL\) 17\.'
          done
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.12
      - name: Record runtime and initialize fresh PostgreSQL database
        run: |
          mkdir -p ci-evidence
          { uv run --no-sync python --version; "$PG_BIN/pg_dump" --version; \
            "$PG_BIN/psql" -h 127.0.0.1 -U nf_dev -d nf_test -Atc 'SHOW server_version; SHOW fsync; SHOW synchronous_commit;'; } \
            2>&1 | tee ci-evidence/environment.log
          uv run --no-sync python -m alembic upgrade head 2>&1 | tee ci-evidence/migration.log
          uv run --no-sync python -m alembic current 2>&1 | tee -a ci-evidence/migration.log
        env:
          PGPASSWORD: nf_dev_ci_only
      - name: All tests with real PostgreSQL 17, race and recovery evidence
        run: |
          uv run --no-sync python -m pytest tests -q \
            --junitxml=ci-evidence/postgres-all.xml --json-report --json-report-file=ci-evidence/postgres-all.json \
            2>&1 | tee ci-evidence/postgres-all.log
      - name: Compare Scion default and enabled traces with the frozen original
        env:
          PYTHONHASHSEED: '2411'
        run: |
          original="$RUNNER_TEMP/nf-scion-original"
          evidence="$GITHUB_WORKSPACE/ci-evidence/scion-differential"
          interpreter="$GITHUB_WORKSPACE/.venv/bin/python"
          test_file=tests/integration/test_scion_differential.py
          git worktree add --detach "$original" 2c28acba6e1932657162c6e55b3288365ce3ea23
          cp "$test_file" "$original/$test_file"
          mkdir -p "$evidence"
          (
            cd "$original"
            PYTHONPATH="$original/src:$original" NF_SCION_DIFF_FROZEN=1 NF_SCION_DIFF_EVIDENCE="$evidence/frozen" \
              "$interpreter" -m pytest "$test_file" -q
          ) 2>&1 | tee "$evidence/frozen.log"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" NF_SCION_DIFF_ORACLE="$evidence/frozen" \
            NF_SCION_DIFF_EVIDENCE="$evidence/current" "$interpreter" -m pytest "$test_file" -q \
            2>&1 | tee "$evidence/current.log"
      - name: Compare current genesis replay with the pinned baseline
        run: |
          uv run --no-sync python -m benchmarks.genesis_paired_profile \
            --agents 200 --repeats 5 --output ci-evidence/genesis-paired.json \
            2>&1 | tee ci-evidence/genesis-paired.log
      - name: Compare current strict canonical checks on the same world
        run: |
          uv run --no-sync python -m benchmarks.canonical_paired_profile \
            --agents 200 --repeats 8 --output ci-evidence/canonical-paired.json \
            2>&1 | tee ci-evidence/canonical-paired.log
      - name: Reproduce historical Context Compiler experiment at e0b0f2b
        # The original experiment requires its shared core to match 0609f680.
        # Preserve that assertion and the complete facts/guard comparison in its
        # original source tree; this step does not validate the current kernel.
        # Current-head regressions and replay comparison execute above, while
        # p3-p4-evidence.yml compares current-core context facts and guard material.
        run: |
          historical_sha=e0b0f2b080f3225d8be8e202e13258bc480f5b84
          historical_root="$RUNNER_TEMP/nf-context-e0b0f2b"
          historical_output="$GITHUB_WORKSPACE/ci-evidence/context-historical-e0b0f2b"
          current_python="$GITHUB_WORKSPACE/.venv/bin/python"
          mkdir -p "$historical_output"
          git worktree add --detach "$historical_root" "$historical_sha"
          test "$(git -C "$historical_root" rev-parse HEAD)" = "$historical_sha"
          (
            cd "$historical_root"
            PYTHONPATH="$historical_root/src:$historical_root" "$current_python" - \
              "$historical_root" "$GITHUB_WORKSPACE" "$historical_output" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import benchmarks.context_paired_profile as paired
          from novel_factory.application import kernel
          from novel_factory.domain import world

          historical, current, output = map(Path, sys.argv[1:])
          historical = historical.resolve()
          origins = {}
          for module in (paired, kernel, world):
              source = Path(module.__file__).resolve()
              assert source.is_relative_to(historical), "Historical experiment imported current source"
              origins[module.__name__] = str(source.relative_to(historical))
          metadata = {
              "scope": "HISTORICAL_REPRODUCTION_NOT_CURRENT_HEAD_VALIDATION",
              "historical_candidate_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], cwd=historical, text=True).strip(),
              "workflow_checkout_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], cwd=current, text=True).strip(),
              "original_source_checks": paired.source_checks(),
              "verified_import_origins": origins,
              "runtime": "Current workflow virtualenv; historical source via fixed PYTHONPATH",
              "dependency_lock_sha256": hashlib.sha256((current / "uv.lock").read_bytes()).hexdigest(),
          }
          (output / "method.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
            PYTHONPATH="$historical_root/src:$historical_root" "$current_python" \
              -m benchmarks.context_paired_profile \
              --entities 1000 --history 12 --subjects 1 20 100 --repeats 5 \
              --output "$historical_output/paired-run.json"
          ) 2>&1 | tee "$historical_output/run.log"
      - name: Probe actual memory services and authorization boundaries
        run: |
          uv run --no-sync python -m benchmarks.memory.service_probe \
            --repeats 3 --output ci-evidence/memory-service \
            2>&1 | tee ci-evidence/memory-service.log
      - name: Persist the complete six-scene TEST_FIXTURE production run
        run: |
          uv run --no-sync python scripts/run_short_volume.py \
            --execution-kind TEST_FIXTURE --output ci-evidence/short-volume \
            --object-root /tmp/nf-ci-short-volume-objects \
            2>&1 | tee ci-evidence/short-volume.log
      - name: Exercise the real HTTP and PostgreSQL behavioral load harness
        run: |
          uv run --no-sync python -m benchmarks.p2_behavioral_load \
            --agents 10 --profile mixed --arrival-rps 10 \
            --output ci-evidence/load-smoke-10.json \
            2>&1 | tee ci-evidence/load-smoke-10.log
      - name: Join A-H design checks to executed JUnit evidence
        run: |
          uv run --no-sync python -m benchmarks.p2_acceptance_matrix \
            --junit ci-evidence/postgres-all.xml --load ci-evidence/load-smoke-10.json \
            --gate-scope executed-tests \
            --output ci-evidence/r1-acceptance.json \
            2>&1 | tee ci-evidence/r1-acceptance.log
      - name: Upload PostgreSQL, concurrency and recovery audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-postgres-concurrency-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 90
