name: Archive S9 controlled experiment
on:
  push:
    branches: ['evidence/p55-s9-business-compare']
    paths: ['.github/workflows/p55-s9-business-receipt.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/p55-s9-business-compare
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43043290680
          name: s9-four-arm-synthetic-writer-and-guard
          path: results
      - name: Validate source, synthetic experiment receipts, and input hashes
        shell: bash
        run: |
          set -euo pipefail
          cd results
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = {"business.json", "original-guard.json", "regressions.xml", "subject-sha.txt", "registration.json", "SHA256SUMS"}
          assert {p.name for p in Path(".").iterdir()} == files
          sums = Path("SHA256SUMS").read_text().splitlines()
          assert len(sums) == len(files) - 1 and all(re.fullmatch(r"[0-9a-f]{64}  [a-zA-Z0-9.\-]+", x) for x in sums)
          assert {x.split()[1] for x in sums} == files - {"SHA256SUMS"}
          assert Path("subject-sha.txt").read_text().strip() == "55d8979b5361a4837701d762feacd83036096b11"
          assert Path("registration.json").read_bytes() == Path("../evidence/p55/business/registration.json").read_bytes()
          result = json.loads(Path("business.json").read_text())
          assert result["source_sha"] == "55d8979b5361a4837701d762feacd83036096b11" and result["seed_sha256"] == "449c54a48715c0973b4e2f81a726a06987b35920e0716f77c90aadbd07db256e"
          assert result["registration_sha256"] == "2b2fad3c7b0f40786719f17c0a42005ce53e8a4ce82e1d07c4722fb09bed2b90"
          assert (result["physical_common_writer_calls"], result["physical_rework_calls"], result["external_model_requests"]) == (3,28,0)
          assert result["real_provider_tokens"] is None and result["actual_invoice"] is None
          observed = {arm: [r for r in result["rows"] if r["arm"] == arm] for arm in "ABCD"}
          for arm, group in observed.items():
              assert {r["trial"] for r in group} == {1,2,3,4} and len(group) == 4
              assert all(len(r["observations"]) == 3 and len(r["attempts"]) == 3+r["rework_calls"] for r in group)
          original = json.loads(Path("original-guard.json").read_text())
          assert [r["arm"] for r in original["rows"]] == list("ABCD")
          assert all(len(o["samples_ms"]) == 12 for r in original["rows"] for o in r["observations"])
          suites = list(ET.fromstring(Path("regressions.xml").read_bytes()).iter("testsuite"))
          assert sum(int(s.get("tests","0")) for s in suites)==9
          assert all(s.get("errors")==s.get("failures")==s.get("skipped")=="0" for s in suites)
          for file in files:
              assert not re.search(rb"Bearer [A-Za-z0-9._-]+|postgres(?:ql)?[^ ]*://[^ ]+:[^ ]+@|-----BEGIN .* PRIVATE KEY",Path(file).read_bytes())
          PY
          sha256sum -c SHA256SUMS
          mkdir -p ../evidence/p55/business/receipts
          cp business.json original-guard.json regressions.xml subject-sha.txt registration.json SHA256SUMS ../evidence/p55/business/receipts/
      - name: Persist evidence on the experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NovelFactory evidence collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/p55/business/receipts
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p55): retain both S9 experiments and original regression receipts"
            git push origin HEAD:refs/heads/evidence/p55-s9-business-compare
          fi
