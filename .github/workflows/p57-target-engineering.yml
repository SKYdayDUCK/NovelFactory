name: P5.7 exact commit engineering qualification
on:
  push:
    branches: [dev/p57-creative-harness-s1-s6]
    paths:
      - '.github/workflows/p57-target-engineering.yml'
      - 'validation/p57_export_gate_receipt.py'
      - 'validation/p57_verify_packaging.py'
      - 'reports/harness/evidence/s6/remote-qualification-target.txt'
permissions:
  contents: read
jobs:
  engineering:
    name: P5.7 ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [harness, dual, comparison, pitr]
    services:
      nf:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: ephemeral-nf-test
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 4s --health-retries 30
      workshop:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: ephemeral-workshop-test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 4s --health-retries 30
      redis:
        image: redis:8.0.2
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 4s --health-retries 30
    env:
      NF_TEST_DATABASE_URL: postgresql+psycopg://postgres:ephemeral-nf-test@127.0.0.1:5433/postgres
      AW_DUAL_TEST_NF_ADMIN_URL: postgresql://postgres:ephemeral-nf-test@127.0.0.1:5433/postgres
      AW_DUAL_TEST_ADMIN_URL: postgresql://postgres:ephemeral-workshop-test@127.0.0.1:5432/postgres
      AW_REDIS_TEST_URL: redis://127.0.0.1:6379/0
      NF_TEST_REDIS_URL: redis://127.0.0.1:6379/1
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the recorded engineering target
        shell: bash
        run: |
          set -euo pipefail
          cp validation/p57_export_gate_receipt.py "$RUNNER_TEMP/p57-export.py"
          target=$(cat reports/harness/evidence/s6/remote-qualification-target.txt)
          [[ "$target" =~ ^[a-f0-9]{40}$ ]]
          if ! git cat-file -e "$target^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$target"
          fi
          git checkout --detach "$target"
          test "$(git rev-parse HEAD)" = "$target"
          git show -s --format='P57_SOURCE %H %T %P' HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked --group dev
      - name: Install the checked-out Workshop package for isolated child services
        run: uv pip install --python .venv/bin/python --no-deps ./workshop
      - name: Install physical restore and local Redis tools
        if: matrix.suite == 'pitr'
        run: bash scripts/ci_install_pg17.sh postgresql-17 postgresql-client-17 redis-server
      - name: Install local Redis tools for the dual-service loss-and-restart test
        if: matrix.suite == 'dual'
        run: bash scripts/ci_install_pg17.sh redis-server
      - name: Run the configured engineering suite
        run: uv run --no-sync python validation/run_p57_acceptance.py "${{ matrix.suite }}" --output "ci-evidence/p57-${{ matrix.suite }}"
      - name: Retain public per-case outcomes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/p57-export.py" "${{ matrix.suite }}" "ci-evidence/p57-${{ matrix.suite }}"
          python - "${{ matrix.suite }}" "ci-evidence/p57-${{ matrix.suite }}" <<'PY'
          import json, os, runpy, sys
          from pathlib import Path
          suite, path = sys.argv[1:]
          ex = runpy.run_path(str(Path(os.environ["RUNNER_TEMP"])/"p57-export.py"))
          doc = ex["export"](suite, path)
          for entry in doc["entries"]:
              result = entry["projection"]
              if entry["file"] == "cases.json":
                  result = {"counts": result.get("summary", result.get("counts", {}))}
              elif entry["file"] not in {"run.json","packaging-evidence.json","paired-restore.json"}:
                  result = {}
              print("P57_SAFE_DETAIL", json.dumps({"suite":suite, "file":entry["file"], "sha256":entry["source_sha256"], "bytes":entry["source_bytes"], "data":result}, separators=(",",":")))
          PY
      - name: Retain the exact checkout and measured outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p57-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            ci-evidence/p57-*/run.json
            ci-evidence/p57-*/cases.json
            ci-evidence/p57-*/comparison.json
            ci-evidence/p57-*/pitr/result.json
          if-no-files-found: warn

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Build wheels and source distribution from the exact target
        shell: bash
        run: |
          set -euo pipefail
          cp validation/p57_export_gate_receipt.py "$RUNNER_TEMP/p57-export.py"
          cp validation/p57_verify_packaging.py "$RUNNER_TEMP/p57-packaging.py"
          target=$(cat reports/harness/evidence/s6/remote-qualification-target.txt)
          [[ "$target" =~ ^[a-f0-9]{40}$ ]]
          if ! git cat-file -e "$target^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$target"
          fi
          git checkout --detach "$target"
          test "$(git rev-parse HEAD)" = "$target"
          python "$RUNNER_TEMP/p57-packaging.py" "$PWD/ci-evidence/p57-packaging"
      - name: Retain public per-case outcomes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/p57-export.py" "packaging" "ci-evidence/p57-packaging"
          python - "packaging" "ci-evidence/p57-packaging" <<'PY'
          import json, os, runpy, sys
          from pathlib import Path
          suite, path = sys.argv[1:]
          ex = runpy.run_path(str(Path(os.environ["RUNNER_TEMP"])/"p57-export.py"))
          doc = ex["export"](suite, path)
          for entry in doc["entries"]:
              result = entry["projection"]
              if entry["file"] == "cases.json":
                  result = {"counts": result.get("summary", result.get("counts", {}))}
              elif entry["file"] not in {"run.json","packaging-evidence.json","paired-restore.json"}:
                  result = {}
              print("P57_SAFE_DETAIL", json.dumps({"suite":suite, "file":entry["file"], "sha256":entry["source_sha256"], "bytes":entry["source_bytes"], "data":result}, separators=(",",":")))
          PY
      - name: Preserve the installation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p57-packaging-${{ github.run_attempt }}
          path: ci-evidence/p57-packaging/packaging-evidence.json
          if-no-files-found: error

  preserve-generated-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: engineering
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: p57-comparison-${{ github.run_attempt }}
          path: captured
      - name: Store the authorized synthetic result as an unreferenced Git data object
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          matches = list(Path('captured').rglob('comparison.json'))
          if len(matches) != 1 or matches[0].stat().st_size > 500000:
              raise SystemExit('Unexpected comparison artifact')
          raw = matches[0].read_bytes()
          doc = json.loads(raw)
          assert doc['planned_windows'] == doc['complete_windows'] == 3
          assert doc['real_model_calls'] == 0 and doc['paid_cost_usd'] == '0'
          assert doc['total_nf_attempts'] == 9 and doc['public_data']
          assert all(row['status'] == 'COMPLETE' for row in doc['rows'])
          expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\x00' + raw).hexdigest()
          assert os.environ['GITHUB_REPOSITORY'] == 'SKYdayDUCK/NovelFactory'
          url = 'https://api.github.com/repos/SKYdayDUCK/NovelFactory/git/blobs'
          payload = json.dumps({'content':base64.b64encode(raw).decode(), 'encoding':'base64'}).encode()
          req = urllib.request.Request(url, data=payload, headers={'Authorization':'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=30) as resp:
              stored = json.load(resp)['sha']
          assert stored == expected
          print('P57_COMPLETE_PUBLIC_RESULT', stored, hashlib.sha256(raw).hexdigest(), len(raw))
          PY
