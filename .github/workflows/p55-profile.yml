name: Profile exact 500-agent projection
on:
  push:
    branches: ['evidence/p55-55d897-guard']
    paths: ['.github/workflows/p55-profile.yml','evidence/p55/checkpoints/profile_fixed_cut.py']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: nf_test
          POSTGRES_USER: nf_dev
          POSTGRES_PASSWORD: nf_dev_ci_only
          POSTGRES_INITDB_ARGS: --data-checksums
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nf_dev -d nf_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      NF_DATABASE_URL: postgresql+psycopg://nf_dev:nf_dev_ci_only@127.0.0.1:5432/nf_test
      NF_TEST_DATABASE_URL: postgresql+psycopg://nf_dev:nf_dev_ci_only@127.0.0.1:5432/nf_test
      PYTHONHASHSEED: '550897'
    steps:
      - uses: actions/checkout@v4
        with:
          path: registration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 55d8979b5361a4837701d762feacd83036096b11
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - uses: actions/checkout@v4
        with:
          ref: f2e6d38534214e79630b807cec9a720d99e975b1
          path: accepted-p5
          persist-credentials: false
      - name: Profile matched logical seeds on accepted P5 and the S9 candidate
        shell: bash
        run: |
          set -euo pipefail
          for arm in accepted-p5 subject; do
            (
              cd "$arm"
              uv sync --locked --group dev --python 3.12
              export BENCH_RESULT="$GITHUB_WORKSPACE/profile-$arm.json"
              export PYTHONPATH="$PWD:$PWD/src"
              .venv/bin/python "$GITHUB_WORKSPACE/registration/evidence/p55/checkpoints/profile_fixed_cut.py"
              .venv/bin/python - "$BENCH_RESULT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print("MEASURED PROFILE",json.dumps({k:data[k] for k in ("raw_bytes","postgres_toast_bytes","witness_retained")}))
          print("MEASURED HOT",json.dumps({k:{j:y[j] for j in ("wall_median_ms","cpu_median_ms")} for k,y in data["timings"].items()}))
          print("MEASURED STAGES",json.dumps({k:y["median"] for k,y in data["delivery_measurements"].items()}))
          PY
            )
          done
      - uses: actions/upload-artifact@v4
        with:
          name: p55-exact-500-fixed-cut-profile
          path: profile-*.json
