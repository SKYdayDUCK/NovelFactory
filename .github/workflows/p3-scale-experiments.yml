name: P3 scale experiments with strict unmet gates

on:
  push:
    branches: ["main", "dev/p3-p4-*"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'contracts/**'
      - 'migrations/**'
      - 'runtime/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/p3-scale-experiments.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'contracts/**'
      - 'migrations/**'
      - 'runtime/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/p3-scale-experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: p3-scale-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measured ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [500-mixed, 1000-read-open, 500-read-soak]
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: nf_test
          POSTGRES_USER: nf_dev
          POSTGRES_PASSWORD: nf_dev_ci_only
          POSTGRES_INITDB_ARGS: --data-checksums
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nf_dev -d nf_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      NF_DATABASE_URL: postgresql+psycopg://nf_dev:nf_dev_ci_only@127.0.0.1:5432/nf_test
      NF_TEST_DATABASE_URL: postgresql+psycopg://nf_dev:nf_dev_ci_only@127.0.0.1:5432/nf_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Locked runtime
        run: uv sync --locked --group dev --python 3.12
      - name: Original targets and actual network evidence
        run: |
          mkdir -p ci-evidence
          case '${{ matrix.scenario }}' in
            500-mixed)
              uv run --no-sync python -m benchmarks.p2_behavioral_load \
                --agents 500 --profile mixed --hot-fraction .2 --arrival-rps 10 \
                --open-loop-rps 1000 --rounds 5 --max-attempts 5 --retry-budget-seconds 30 \
                --service-mode isolated-process --api-processes 2 --gate-scope capacity \
                --output ci-evidence/result.json 2>&1 | tee ci-evidence/run.log
              ;;
            1000-read-open)
              uv run --no-sync python -m benchmarks.p3_open_arrival \
                --agents 1000 --rounds 5 --arrival-rps 1000 --hot-fraction .8 --api-processes 2 \
                --output ci-evidence/result.json 2>&1 | tee ci-evidence/run.log
              ;;
            500-read-soak)
              uv run --no-sync python -m benchmarks.p3_stability \
                --agents 500 --seconds 600 --read-rps 20 --api-processes 2 \
                --output ci-evidence/result.json 2>&1 | tee ci-evidence/run.log
              ;;
          esac
      - name: Preserve complete evidence when capacity fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-scale-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 90
