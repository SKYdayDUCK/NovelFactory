name: Database candidates on Windows and Redis recovery on Linux
on:
  push:
    branches: [experiment/p59-database-throughput]
    paths: ['.github/workflows/p59-db-platform.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked --group dev --python 3.12
      - name: Start runner-private PostgreSQL 17
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $env:PGPASSWORD = 'root'
          $version = & "$env:PGBIN/psql.exe" -XAt -h 127.0.0.1 -U postgres -c 'show server_version_num'
          if ($LASTEXITCODE -ne 0 -or [int]$version -lt 170000 -or [int]$version -ge 180000) { throw 'PostgreSQL 17 required' }
          & "$env:PGBIN/createdb.exe" -h 127.0.0.1 -U postgres nf_exp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'NF_TEST_DATABASE_URL=postgresql+psycopg://postgres:root@127.0.0.1:5432/nf_exp' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Native role, cancellation, renewal and authority tests
        run: >-
          uv run --no-sync python -m pytest -q tests/integration/test_p59_db_candidates.py
          tests/integration/test_p59_read_soak_renewal.py tests/integration/test_p59_revision_witness.py tests/integration/test_p59_fenced_status.py
          tests/unit/test_p59_http_shards.py tests/unit/test_p55_capacity.py
          tests/unit/test_native_platform.py tests/integration/test_bound_tool_entrypoints.py
          tests/integration/test_mcp_idle_pool.py tests/integration/test_p58_routing.py
          --junitxml=windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-native-windows-${{ github.sha }}
          path: windows.xml
  redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: aw_exp
          POSTGRES_PASSWORD: disposable
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:8.0.2
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      AW_DATABASE_URL: postgresql://postgres:disposable@localhost:5432/aw_exp
      AW_REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - working-directory: workshop
        run: uv sync --locked --group dev --extra streams
      - working-directory: workshop
        run: uv run --no-sync python -m alembic upgrade head
      - name: Stop and restart this runner's disposable Redis and replay from PostgreSQL
        working-directory: workshop
        env:
          AW_REDIS_TEST_CONTAINER: ${{ job.services.redis.id }}
        run: uv run --no-sync python -m pytest -q tests/test_notifications.py --junitxml=outage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-redis-recovery-${{ github.sha }}
          path: workshop/outage.xml
