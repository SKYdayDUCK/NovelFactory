[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agent-workshop"
version = "0.1.0"
description = "Independent organization control plane for NovelFactory"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2,<2.1", "mcp==1.29.0", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
streams = ["redis>=6.4,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[project.scripts]
aw-migrate = "agent_workshop.migrate:main"
aw-manager-run = "agent_workshop.manager_worker:main"
aw-reconcile = "agent_workshop.reconcile:main"
aw-provision = "agent_workshop.provision:main"
aw-mcp = "agent_workshop.server:main"
aw-admin = "agent_workshop.admin:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "agent_workshop/migrations"
"contracts/nf-catalog.json" = "agent_workshop/contracts/nf-catalog.json"
