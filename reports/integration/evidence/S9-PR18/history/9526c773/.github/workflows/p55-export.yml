name: Publish fixed P55 synthetic evidence
on:
  push:
    branches: ['evidence/p55-55d897-guard']
    paths: ['.github/workflows/p55-export.yml','evidence/p55/checkpoints/export_fixed_receipts.py']
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          path: instructions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: evidence/p55-receipts-55d897
          path: receipt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43039818150
          name: exact-55d897-s9-guard-and-junit
          path: artifact-guard
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43036514307
          name: p3-scale-500-read-soak-1
          path: artifact-candidate-attempt-1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43035161204
          name: p3-scale-500-read-soak-1
          path: artifact-previous-attempt-1
      - name: Check exact manifest, redact infrastructure fields, retain request outcomes
        run: python instructions/evidence/p55/checkpoints/export_fixed_receipts.py
      - name: Publish to the dedicated evidence branch only
        working-directory: receipt
        run: |
          git config user.name "NovelFactory evidence collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/p55/s9-local/remote-55d897
          if ! git diff --cached --quiet; then
            git commit -m "evidence(p55): store pinned guard and per-request 600s results"
            git push origin HEAD:refs/heads/evidence/p55-receipts-55d897
          fi
          git rev-parse HEAD
