[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# migrations/env.py reads NF_DATABASE_URL; no deployment credentials here.
sqlalchemy.url = postgresql+psycopg://nf_dev@127.0.0.1:55432/nf_test

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
