# Development baseline. Create and protect the data directory before startup.
bind 127.0.0.1
protected-mode yes
port 6379
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
maxmemory 256mb
maxmemory-policy noeviction
maxclients 64
timeout 0
# Supply the ACL file and persistence directory on the command line.
# Never expose this development listener on a public interface.
